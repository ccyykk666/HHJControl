name: OTA Build

on:
  workflow_dispatch:
    inputs:
      method:
        description: Signing method
        required: true
        type: choice
        default: ad-hoc
        options: [ad-hoc, enterprise]
      bundleId:
        description: Bundle identifier (must exactly match the profile)
        required: true
        default: app.sagittarius9983.grape3949
      appName:
        description: Display and release name
        required: true
        default: Motus

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ota-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs and secrets
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          set -euo pipefail
          [[ '${{ inputs.bundleId }}' == 'app.sagittarius9983.grape3949' ]] || { echo 'bundleId must be app.sagittarius9983.grape3949'; exit 1; }
          [[ -n "$CERT_P12_BASE64" ]] || { echo 'Missing secret CERT_P12_BASE64'; exit 1; }
          [[ -n "$CERT_PASSWORD" ]] || { echo 'Missing secret CERT_PASSWORD'; exit 1; }
          [[ -n "$PROVISIONING_PROFILE_BASE64" ]] || { echo 'Missing secret PROVISIONING_PROFILE_BASE64'; exit 1; }
          [[ -n "$GEOAPIFY_API_KEY" ]] || { echo 'Missing secret GEOAPIFY_API_KEY'; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode and validate signing material
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          SIGN_DIR="$RUNNER_TEMP/hhj-sign"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$SIGN_DIR/cert.p12"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$SIGN_DIR/profile.mobileprovision"
          security cms -D -i "$SIGN_DIR/profile.mobileprovision" > "$SIGN_DIR/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$SIGN_DIR/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$SIGN_DIR/profile.plist")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$SIGN_DIR/profile.plist")
          PROFILE_BUNDLE_ID="${APP_IDENTIFIER#${TEAM_ID}.}"
          EXPIRATION=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$SIGN_DIR/profile.plist")

          [[ "$TEAM_ID" == '8T79G573A3' ]] || { echo "Team mismatch: $TEAM_ID"; exit 1; }
          [[ "$PROFILE_BUNDLE_ID" == '${{ inputs.bundleId }}' ]] || { echo "Profile bundle ID mismatch: $PROFILE_BUNDLE_ID"; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$SIGN_DIR/profile.plist" 2>/dev/null | grep -qx true; then
            echo 'Development profiles are not accepted for OTA release.'; exit 1
          fi
          IS_ENTERPRISE=false
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$SIGN_DIR/profile.plist" 2>/dev/null | grep -qx true; then IS_ENTERPRISE=true; fi
          HAS_DEVICES=false
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices:0' "$SIGN_DIR/profile.plist" >/dev/null 2>&1; then HAS_DEVICES=true; fi
          if [[ '${{ inputs.method }}' == enterprise && "$IS_ENTERPRISE" != true ]]; then
            echo 'Signing method mismatch: enterprise was selected, but this profile is ad-hoc (ProvisionedDevices present; ProvisionsAllDevices absent).'; exit 1
          fi
          if [[ '${{ inputs.method }}' == ad-hoc && "$HAS_DEVICES" != true ]]; then
            echo 'Signing method mismatch: ad-hoc requires at least one ProvisionedDevices entry.'; exit 1
          fi
          echo "Profile: $PROFILE_NAME ($PROFILE_UUID), team $TEAM_ID, expires $EXPIRATION"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "team=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "sign_dir=$SIGN_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare temporary keychain
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          SIGN_DIR='${{ steps.signing.outputs.sign_dir }}'
          OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL_BIN" pkcs12 \
            -in "$SIGN_DIR/cert.p12" \
            -passin env:CERT_PASSWORD \
            -nodes \
            -out "$SIGN_DIR/signing.pem"
          "$OPENSSL_BIN" pkcs12 \
            -export \
            -legacy \
            -in "$SIGN_DIR/signing.pem" \
            -out "$SIGN_DIR/cert-compatible.p12" \
            -passout env:CERT_PASSWORD
          rm -f "$SIGN_DIR/signing.pem"

          KEYCHAIN="$RUNNER_TEMP/hhj-${{ github.run_id }}.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGN_DIR/cert-compatible.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp '${{ steps.signing.outputs.sign_dir }}/profile.mobileprovision' "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.uuid }}.mobileprovision"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile without signing
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          xcodebuild build \
            -project HHJControl.xcodeproj \
            -scheme HHJControl \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            GEOAPIFY_API_KEY="$GEOAPIFY_API_KEY" \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}'

      - name: Archive with manual signing
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project HHJControl.xcodeproj \
            -scheme HHJControl \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HHJControl.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM='${{ steps.signing.outputs.team }}' \
            PROVISIONING_PROFILE_SPECIFIER='${{ steps.signing.outputs.name }}' \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PRODUCT_BUNDLE_IDENTIFIER='${{ inputs.bundleId }}' \
            INFOPLIST_KEY_CFBundleDisplayName='${{ inputs.appName }}' \
            GEOAPIFY_API_KEY="$GEOAPIFY_API_KEY" \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}'

      - name: Export signed IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${{ inputs.method }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ steps.signing.outputs.team }}</string>
            <key>provisioningProfiles</key><dict><key>${{ inputs.bundleId }}</key><string>${{ steps.signing.outputs.name }}</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HHJControl.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          [[ -n "$IPA" ]] || { echo 'No IPA was exported'; exit 1; }
          cp "$IPA" "$RUNNER_TEMP/HHJControl.ipa"

      - name: Audit IPA contents and signature
        run: |
          set -euo pipefail
          AUDIT="$RUNNER_TEMP/audit"
          mkdir -p "$AUDIT"
          unzip -q "$RUNNER_TEMP/HHJControl.ipa" -d "$AUDIT"
          APP=$(find "$AUDIT/Payload" -maxdepth 1 -name '*.app' -print -quit)
          [[ -n "$APP" ]] || { echo 'Payload app missing'; exit 1; }
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" == '${{ inputs.bundleId }}' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" == '1.0.0' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" == '26.0' ]]
          [[ -n "$(/usr/libexec/PlistBuddy -c 'Print :GEOAPIFY_API_KEY' "$APP/Info.plist")" ]] || { echo 'Geoapify API key missing from app configuration'; exit 1; }
          [[ -f "$APP/PrivacyInfo.xcprivacy" ]] || { echo 'PrivacyInfo.xcprivacy missing'; exit 1; }
          if find "$APP/Frameworks" -maxdepth 1 -type d -name '*.framework' 2>/dev/null | grep -q .; then
            echo 'Third-party or unexpected .framework bundle found:'
            find "$APP/Frameworks" -maxdepth 1 -type d -name '*.framework'
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/signed-entitlements.plist"
          SIGNED_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$RUNNER_TEMP/signed-entitlements.plist")
          [[ "$SIGNED_APP_ID" == '${{ steps.signing.outputs.team }}.${{ inputs.bundleId }}' ]]
          echo 'IPA audit passed: signature, bundle ID, version, deployment target, privacy manifest, and framework policy.'

      - name: Create OTA metadata and install pages
        id: meta
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}"
          RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          MANIFEST_URL="$RELEASE_BASE/manifest.plist"
          OTA_URL="itms-services://?action=download-manifest&url=$MANIFEST_URL"
          mkdir -p dist page
          cp "$RUNNER_TEMP/HHJControl.ipa" dist/HHJControl.ipa
          cat > dist/manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>$RELEASE_BASE/HHJControl.ipa</string></dict></array>
            <key>metadata</key><dict><key>bundle-identifier</key><string>${{ inputs.bundleId }}</string><key>bundle-version</key><string>1.0.0</string><key>kind</key><string>software</string><key>title</key><string>${{ inputs.appName }}</string></dict>
          </dict></array></dict></plist>
          PLIST
          cat > dist/install.html <<HTML
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>${{ inputs.appName }}</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#050a35,#076bd5);color:white}.card{max-width:420px;margin:24px;padding:32px;border:1px solid #ffffff45;border-radius:28px;background:#ffffff18;backdrop-filter:blur(28px);box-shadow:0 24px 80px #0006}h1{margin:.2em 0}p{line-height:1.55;color:#eaf2ff}.button{display:block;margin-top:24px;padding:15px 20px;border-radius:16px;background:white;color:#0758b5;text-align:center;text-decoration:none;font-weight:700}.meta{font-size:14px}</style><body><main class="card"><div>HHJControl · OTA</div><h1>${{ inputs.appName }}</h1><p>使用 iPhone Safari 打开此页面并安装。首次安装后可能需要在“设置 → 通用 → VPN 与设备管理”中信任签名。</p><p class="meta">版本 1.0.0 · 构建 ${{ github.run_number }} · ${{ inputs.method }}</p><a class="button" href="$OTA_URL">安装 App</a><p><a style="color:white" href="https://github.com/${{ github.repository }}/releases/tag/$TAG">查看 Release</a></p></main></body></html>
          HTML
          cp dist/install.html page/index.html
          cp dist/manifest.plist page/manifest.plist
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "Manifest: $MANIFEST_URL"
          echo "OTA: $OTA_URL"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ steps.meta.outputs.tag }}' dist/HHJControl.ipa dist/manifest.plist dist/install.html --title '${{ inputs.appName }} ${{ steps.meta.outputs.tag }}' --notes 'iOS 26 native HHJControl build ${{ github.run_number }} (${{ inputs.method }}).'

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: page

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/hhj-sign" "$RUNNER_TEMP/audit" "$RUNNER_TEMP/export" "$RUNNER_TEMP/HHJControl.xcarchive" "$RUNNER_TEMP/HHJControl.ipa" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/signed-entitlements.plist"

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
